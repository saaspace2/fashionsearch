[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: fast, no external dependencies
    integration: needs a live Databricks workspace
    data: validates data quality in Unity Catalog
    registry: checks Unity Catalog model registry state
    smoke: minimal end-to-end sanity check
