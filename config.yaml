# Single source of truth for the whole pipeline.
# Every notebook reads this; nothing hardcodes a name or a threshold.

project:
  name: fashionsearch
  owner: search-team@example.com

catalog:
  name: fashion_dev
  schemas: [raw, bronze, silver, gold, ml, monitoring]
  volumes:
    product_images: /Volumes/fashion_dev/raw/product_images
    query_images:   /Volumes/fashion_dev/raw/query_images
    artifacts:      /Volumes/fashion_dev/ml/artifacts

# Pretrained models pulled from Hugging Face by notebook 03.
# These are the original project author's published checkpoints — real,
# public, and directly usable. No training required.
pretrained:
  detector:
    hf_repo: yainage90/fashion-object-detection
    task: object-detection
    categories: [bag, bottom, dress, hat, outer, shoes, top]
  encoder:
    hf_repo: yainage90/fashion-image-feature-extractor
    embedding_dim: 128          # the published encoder outputs 128, not 512
    image_size: 224

# Datasets pulled from Hugging Face by notebook 01.
data:
  detection:
    hf_dataset: yainage90/fashion-object-detection
    split: train
  pairs:
    hf_dataset: yainage90/onthelook-fashion-anchor-positive-images
    split: train
  # Free Edition has no GPU, so this is the main cost lever.
  #
  # At 2000 the smallest categories ended up with 5 and 10 eval queries, which
  # is not enough to measure anything — the gate correctly refused to pretend
  # otherwise. 10000 gives every category enough to score.
  #
  # Expect roughly 45-75 minutes of embedding on serverless CPU.
  sample_size: 10000

  # Nothing is trained in this pipeline — the models are imported already
  # trained — so gold.train_pairs is never read and the training split is pure
  # waste. A large eval set is therefore close to free, and strictly better:
  # every extra query is a better measurement.
  #
  # Sizing is driven by the rarest protected slice. Bags are 2.6% of this
  # dataset, so 500 eval queries gave 13 bags — a Recall@20 estimate with a
  # standard error near 11 percentage points, which is noise, not a measurement.
  # 1000 gives roughly 26 bags. Notebook 02 prints the arithmetic.
  eval_queries: 1000

registry:
  detector_model: fashion_dev.ml.fashion_detector
  encoder_model:  fashion_dev.ml.fashion_encoder

  # The deployable unit. Detector and encoder keep separate version histories
  # for evaluation and lineage; this pins one of each and is what the serving
  # endpoint actually runs, so a client sends a photo rather than orchestrating
  # two calls and cropping in between.
  search_model:   fashion_dev.ml.fashion_search

  # How notebooks load a model. This does NOT change where models are
  # registered — Unity Catalog remains the registry, with versions, aliases and
  # lineage. It only chooses the read route.
  #
  #   auto      volume copy if present, registry otherwise  (default)
  #   registry  always models:/...
  #   volume    always the volume copy
  #
  # "auto" defaults to the volume because this workspace tier cannot read model
  # artifacts from a notebook — the cluster's assumed role is denied on that
  # storage, the same denial that blocked registering from inside Databricks.
  # Trying the registry first on every load just produces a long HeadObject 400
  # traceback before falling back anyway.
  load_from: auto
  aliases:
    candidate: candidate
    shadow: shadow
    champion: production

# Promotion gate. A candidate must clear ALL of these to earn @candidate.
# See src/fashionsearch/promotion.py.
gate:
  primary_metric: ndcg_at_20
  k_values: [1, 5, 10, 20, 50]
  min_ndcg20_vs_champion: 0.0      # must at least match
  max_recall20_drop_any_slice: 0.01
  max_recall20_drop_protected: 0.005
  # A recall estimate from fewer queries than this is noise, so the gate treats
  # such a slice as unmeasured rather than passed. Silence is not a pass.
  min_queries_per_slice: 20

  # Rare and hard. An aggregate metric will always trade these away, because
  # there are not enough of them to move an average.
  #
  # NOTE ON size_band AND occlusion: this dataset's anchor images are already
  # tight crops of single garments, not full outfit photos, so the detected box
  # fills the frame and almost everything scores as "large". Those slices are
  # therefore not measurable here and are commented out rather than deleted —
  # on real user photos, where the garment is a small part of a busy scene,
  # they are the most important slices in the list. Re-enable them then.
  protected_slices:
    - [category, bag]
    - [category, hat]
    # - [size_band, small]
    # - [occlusion, heavy]

serving:
  endpoint_name: fashion-encoder-endpoint
  workload_size: Small
  scale_to_zero: true
  max_p95_latency_ms: 250

monitoring:
  min_ctr: 0.18
  max_zero_result_rate: 0.04
  # How old embeddings may get before it is worth saying something.
  #
  # Six hours is the right number for a live shop, where the catalogue turns
  # over constantly and a stale index means returning products that are sold
  # out. It is the wrong number here: embeddings refresh when the Kaggle job
  # runs, which happens on a push, and days between pushes is normal.
  #
  # At six hours this fired on ordinary development rhythm — an alert that
  # cries wolf teaches you to ignore the channel it arrives on, which costs
  # more than the thing it was warning about.
  #
  # A week for development. Drop it back to 6 when this serves real users.
  max_index_staleness_hours: 168
  drift_threshold: 0.15
