# Single source of truth for the whole pipeline.
# Every notebook reads this; nothing hardcodes a name or a threshold.

project:
  name: fashionsearch
  owner: search-team@example.com

catalog:
  name: fashion_dev
  schemas: [raw, bronze, silver, gold, ml, monitoring]
  volumes:
    product_images: /Volumes/fashion_dev/raw/product_images
    query_images:   /Volumes/fashion_dev/raw/query_images
    artifacts:      /Volumes/fashion_dev/ml/artifacts

# Pretrained models pulled from Hugging Face by notebook 03.
# These are the original project author's published checkpoints — real,
# public, and directly usable. No training required.
pretrained:
  detector:
    hf_repo: yainage90/fashion-object-detection
    task: object-detection
    categories: [bag, bottom, dress, hat, outer, shoes, top]
  encoder:
    hf_repo: yainage90/fashion-image-feature-extractor
    embedding_dim: 128          # the published encoder outputs 128, not 512
    image_size: 224

# Datasets pulled from Hugging Face by notebook 01.
data:
  detection:
    hf_dataset: yainage90/fashion-object-detection
    split: train
  pairs:
    hf_dataset: yainage90/onthelook-fashion-anchor-positive-images
    split: train
  # Free Edition has no GPU, so this is the main cost lever.
  #
  # At 2000 the smallest categories ended up with 5 and 10 eval queries, which
  # is not enough to measure anything — the gate correctly refused to pretend
  # otherwise. 10000 gives every category enough to score.
  #
  # Expect roughly 45-75 minutes of embedding on serverless CPU.
  sample_size: 10000
  eval_queries: 400

registry:
  detector_model: fashion_dev.ml.fashion_detector
  encoder_model:  fashion_dev.ml.fashion_encoder
  aliases:
    candidate: candidate
    shadow: shadow
    champion: production

# Promotion gate. A candidate must clear ALL of these to earn @candidate.
# See src/fashionsearch/promotion.py.
gate:
  primary_metric: ndcg_at_20
  k_values: [1, 5, 10, 20, 50]
  min_ndcg20_vs_champion: 0.0      # must at least match
  max_recall20_drop_any_slice: 0.01
  max_recall20_drop_protected: 0.005
  # A recall estimate from fewer queries than this is noise, so the gate treats
  # such a slice as unmeasured rather than passed. Silence is not a pass.
  min_queries_per_slice: 20

  # Rare and hard. An aggregate metric will always trade these away, because
  # there are not enough of them to move an average.
  #
  # NOTE ON size_band AND occlusion: this dataset's anchor images are already
  # tight crops of single garments, not full outfit photos, so the detected box
  # fills the frame and almost everything scores as "large". Those slices are
  # therefore not measurable here and are commented out rather than deleted —
  # on real user photos, where the garment is a small part of a busy scene,
  # they are the most important slices in the list. Re-enable them then.
  protected_slices:
    - [category, bag]
    - [category, hat]
    # - [size_band, small]
    # - [occlusion, heavy]

serving:
  endpoint_name: fashion-encoder-endpoint
  workload_size: Small
  scale_to_zero: true
  max_p95_latency_ms: 250

monitoring:
  min_ctr: 0.18
  max_zero_result_rate: 0.04
  max_index_staleness_hours: 6
  drift_threshold: 0.15
