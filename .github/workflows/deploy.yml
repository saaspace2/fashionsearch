name: 1 · Setup — Databricks and Kaggle

# ONE PUSH SETS EVERYTHING UP. It does not evaluate or deploy a model.
#
#   validate    tests, lint, bundle validate
#   databricks  deploy the bundle, create the catalog, schemas and volumes
#   kaggle      publish credentials, push the GPU kernel
#
# Pushing a kernel also starts it — the Kaggle CLI has no push-without-run — so
# the GPU job begins here. When it finishes it calls back into GitHub and
# workflow 2 takes over.
#
#     push ──► setup (this) ──► Kaggle GPU run ──► repository_dispatch
#                                                        │
#                                                        ▼
#                                          workflow 2 · pipeline
#                                          evaluate, gate, serve
#
# Required GitHub secrets:
#   KAGGLE_API_TOKEN   from kaggle.com/settings/api -> Generate New Token
#   KAGGLE_USERNAME    your Kaggle username (used to build the kernel id)
#   DATABRICKS_HOST    DATABRICKS_TOKEN
#   GH_DISPATCH_TOKEN  a PAT with 'repo' scope, so Kaggle can call back
#
# NOTE: the Kaggle CLI moved from the old username+key pair to a single
# KAGGLE_API_TOKEN. Supplying only the old pair now fails with
# "Authentication required to call the Kaggle API".

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-ci.txt
      - run: ruff check src/ --exit-zero
      - run: pytest tests/ -v
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev

  databricks_setup:
    name: Deploy bundle and create Unity Catalog
    needs: validate
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Deploy the bundle
        # Uploads code and updates job definitions. Executes nothing.
        run: databricks bundle deploy -t dev

      - name: Create catalog, schemas and volumes
        # Idempotent — every statement is IF NOT EXISTS.
        run: databricks bundle run fashion_setup -t dev

      - run: databricks bundle summary -t dev

  kaggle_setup:
    name: Publish credentials and start the GPU run
    needs: [validate, databricks_setup]
    if: >-
      github.event_name != 'pull_request'
      && !startsWith(github.ref, 'refs/tags/')
      && !contains(github.event.head_commit.message, '[skip kaggle]')
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade kaggle

      - name: Check Kaggle authentication before doing anything
        # The CLI prints a long help message and exits non-zero when it cannot
        # authenticate, which is easy to mistake for a different problem. Fail
        # here with a message that names the actual fix.
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::KAGGLE_API_TOKEN is not set."
            echo "Get one at https://www.kaggle.com/settings/api -> Generate New Token,"
            echo "then add it as a GitHub secret named KAGGLE_API_TOKEN."
            echo "The old KAGGLE_USERNAME + KAGGLE_KEY pair no longer authenticates."
            exit 1
          fi
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "::error::KAGGLE_USERNAME is not set — needed to build the kernel id."
            exit 1
          fi
          kaggle kernels list --mine --page-size 1 >/dev/null
          echo "Kaggle authentication OK for ${KAGGLE_USERNAME}"

      - name: Publish credentials as a private Kaggle dataset
        # Kaggle Secrets are UI-managed and stripped on every CLI push, so a
        # kernel relying on them loses its credentials the moment this workflow
        # runs. Dataset attachments live in kernel-metadata.json, which the
        # kernel owns, and do survive.
        #
        # The dataset is private. Use a short-lived Databricks token.
        run: |
          set -e
          mkdir -p /tmp/creds
          cat > /tmp/creds/credentials.json <<JSON
          {
            "DATABRICKS_HOST": "${{ secrets.DATABRICKS_HOST }}",
            "DATABRICKS_TOKEN": "${{ secrets.DATABRICKS_TOKEN }}",
            "GH_DISPATCH_TOKEN": "${{ secrets.GH_DISPATCH_TOKEN }}",
            "GH_REPO": "${{ github.repository }}"
          }
          JSON
          cat > /tmp/creds/dataset-metadata.json <<JSON
          {
            "title": "fashionsearch credentials",
            "id": "${KAGGLE_USERNAME}/fashionsearch-credentials",
            "licenses": [{ "name": "CC0-1.0" }]
          }
          JSON

          if kaggle datasets status "${KAGGLE_USERNAME}/fashionsearch-credentials" 2>&1 | grep -qi 'not found\|404'; then
            kaggle datasets create -p /tmp/creds --dir-mode zip
          else
            kaggle datasets version -p /tmp/creds -m "rotate ${{ github.sha }}" --dir-mode zip
          fi
          sleep 20      # Kaggle needs a moment before the dataset is attachable

      - name: Build the notebook and push it — this also starts it on a T4
        run: |
          set -e
          mkdir -p /tmp/kernel

          # A real .ipynb, so what lands on Kaggle is a notebook you can open,
          # read and re-run cell by cell. Generated from run_on_kaggle.py, which
          # stays the single source of truth.
          python kaggle/build_notebook.py /tmp/kernel/fashionsearch-gpu.ipynb

          # Generated here so the username comes from the secret and nobody has
          # to edit a committed file.
          cat > /tmp/kernel/kernel-metadata.json <<JSON
          {
            "id": "${KAGGLE_USERNAME}/fashionsearch-gpu",
            "title": "FashionSearch GPU",
            "code_file": "fashionsearch-gpu.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": ["${KAGGLE_USERNAME}/fashionsearch-credentials"],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          JSON

          OUT=$(kaggle kernels push -p /tmp/kernel --accelerator NvidiaTeslaT4 2>&1) || true
          echo "$OUT"
          # The CLI sometimes prints an error and still exits zero, which would
          # let this job go green having done nothing.
          if echo "$OUT" | grep -qiE 'error|forbidden|403|404|not created|authentication'; then
            echo "::error::Kernel push failed — see output above."
            exit 1
          fi

          echo ""
          echo "=================================================================="
          echo " The Kaggle kernel is running on a T4."
          echo "   https://kaggle.com/code/${KAGGLE_USERNAME}/fashionsearch-gpu"
          echo ""
          echo " It embeds the catalogue, registers the encoder in Unity Catalog,"
          echo " uploads the vectors, then calls back into GitHub."
          echo " Workflow 2 takes over from there — nothing else to do."
          echo "=================================================================="

  deploy-prod:
    name: Deploy to prod
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
