name: 3 · Run Databricks PIPELINE (after Kaggle)

# Runs the evaluation pipeline over what Kaggle produced: ingest the embeddings,
# score per slice, apply the promotion gate, deploy the serving endpoint if the
# model reached Unity Catalog, then render searches and the dashboard.
#
# TRIGGERS
#   repository_dispatch (kaggle-complete) — fired by kaggle/run_on_kaggle.py
#     when it has uploaded its output and registered the encoder.
#   workflow_dispatch — the manual fallback.
#
# It re-deploys the bundle first. That is cheap and idempotent, and guarantees
# the pipeline runs the same commit that produced the Kaggle output rather than
# whatever happened to be deployed last.

on:
  repository_dispatch:
    types: [kaggle-complete]
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  pipeline:
    name: Ingest, evaluate, gate, serve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: What Kaggle sent
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "created_at        : ${{ github.event.client_payload.created_at }}"
          echo "products embedded : ${{ github.event.client_payload.n_products }}"
          echo "eval queries      : ${{ github.event.client_payload.n_queries }}"
          echo "registered model  : ${{ github.event.client_payload.registered_model }}"
          echo "version           : ${{ github.event.client_payload.registered_version }}"
          echo "fine-tuned        : ${{ github.event.client_payload.finetuned }}"

      - name: Deploy the latest code
        run: databricks bundle deploy -t dev

      - name: Run the pipeline
        # 05b ingests Kaggle's embeddings; 06 gates; 07 creates the serving
        # endpoint if the model reached Unity Catalog; 10 and 11 report.
        run: databricks bundle run fashion_pipeline -t dev

      - name: Where to look
        if: always()
        run: |
          echo "Catalog -> fashion_dev for tables and volumes."
          echo "gold.retrieval_metrics — Recall@k, MRR, NDCG per slice."
          echo "Task 07_serving_check  — whether an endpoint was created."
          echo "Tasks 10 and 11        — real searches, and the dashboard."
