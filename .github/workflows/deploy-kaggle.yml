name: deploy-to-kaggle

# Pushes the GPU code to Kaggle on every commit. It does NOT run the kernel.
#
# That is deliberate, and the DR-AutoML project learned it the hard way: a
# kernel pushed by API loses its secret attachments and its accelerator
# selection. So the run has to be started by hand once, from the Kaggle editor,
# with the secrets ticked and GPU T4 chosen.
#
# Required GitHub secrets: KAGGLE_USERNAME, KAGGLE_KEY

on:
  push:
    branches: [main]
    paths:
      - 'kaggle/**'
      - 'src/**'
      - 'config.yaml'
  workflow_dispatch:

jobs:
  push_to_kaggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade kaggle

      - name: Stage and push the kernel
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -e
          mkdir -p /tmp/kernel
          cp kaggle/run_on_kaggle.py /tmp/kernel/
          cp kaggle/kernel-metadata.json /tmp/kernel/

          echo "Staged:"
          ls -la /tmp/kernel

          OUT=$(kaggle kernels push -p /tmp/kernel 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qiE 'error|forbidden|403|404|not created'; then
            echo "::error::Kernel push failed — see output above."
            exit 1
          fi

          echo ""
          echo "=================================================================="
          echo " Code is on Kaggle. It did NOT run."
          echo ""
          echo " NEXT, once:"
          echo "   1. Open the kernel on Kaggle"
          echo "   2. Add-ons -> Secrets -> tick DATABRICKS_HOST and"
          echo "      DATABRICKS_TOKEN"
          echo "   3. Sidebar -> Accelerator -> GPU T4"
          echo "   4. Run All"
          echo ""
          echo " It embeds the catalogue on GPU and uploads the vectors to"
          echo " /Volumes/fashion_dev/silver/kaggle_inbox/."
          echo " Then run the Databricks job: notebook 05b ingests them."
          echo "=================================================================="
