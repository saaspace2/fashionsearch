name: 1 · Kaggle GPU run

# Push the notebook, run it on a T4, collect the results, and hand them to
# Databricks. Everything from one `git push`.
#
# KAGGLE HOLDS NO CREDENTIALS. That is deliberate.
#
# Getting credentials onto Kaggle needs either a private Dataset — refused with
# 403 on accounts without phone verification — or Kaggle Secrets, which are
# stripped on every CLI push and would need re-ticking by hand each time. Both
# defeat the point of a pipeline.
#
# So Kaggle does pure GPU compute and writes to its kernel output. This workflow
# downloads that output, uploads the embeddings, and registers the encoder in
# Unity Catalog itself.
#
# Registering from here works for the same reason it would have worked from
# Kaggle: a GitHub runner is outside Databricks, so the upload uses the REST API
# with a token rather than a cluster's assumed IAM role — and it is that role
# which the workspace bucket policy explicitly denies.
#
# Secrets: KAGGLE_API_TOKEN  KAGGLE_USERNAME  DATABRICKS_HOST  DATABRICKS_TOKEN

# No paths filter. This workflow is the entire pipeline — GPU run, model
# registration and the Databricks jobs — so a change to any notebook has to be
# able to trigger it. An earlier filter listed only kaggle/, src/ and
# config.yaml, and a fix to notebooks/04 silently ran nothing at all.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_kaggle:
        description: 'Reuse existing embeddings, skip the GPU run'
        type: boolean
        default: false

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  gpu_run:
    name: Kaggle GPU run and model registration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Skippable on its own. A notebook-only change does not need fresh
    # embeddings — the ones already in the volume are still valid — so this
    # skips while the pipeline below still runs.
    if: >-
      !contains(github.event.head_commit.message, '[skip kaggle]')
      && (github.event_name != 'workflow_dispatch' || !inputs.skip_kaggle)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade kaggle

      - name: Check Kaggle authentication
        run: |
          # Trim whitespace. A secret pasted with a trailing newline fails in a
          # way that is invisible in the log and works fine locally.
          TOKEN="$(echo -n "$KAGGLE_API_TOKEN" | tr -d '[:space:]')"
          echo "KAGGLE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          if [ -z "$TOKEN" ]; then
            echo "::error::KAGGLE_API_TOKEN is not set."
            echo "kaggle.com/settings/api -> Generate New Token"
            exit 1
          fi
          KAGGLE_API_TOKEN="$TOKEN" kaggle kernels list --mine --page-size 1
          echo "authenticated as ${KAGGLE_USERNAME}"

      - name: Build the notebook and push it — this also starts it
        run: |
          set -e
          mkdir -p /tmp/kernel
          python kaggle/build_notebook.py /tmp/kernel/fashionsearch-gpu.ipynb

          # No dataset_sources: the kernel needs no credentials.
          cat > /tmp/kernel/kernel-metadata.json <<JSON
          {
            "id": "${KAGGLE_USERNAME}/fashionsearch-gpu",
            "title": "FashionSearch GPU",
            "code_file": "fashionsearch-gpu.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": []
          }
          JSON

          OUT=$(kaggle kernels push -p /tmp/kernel --accelerator NvidiaTeslaT4 2>&1) || true
          echo "$OUT"
          # The CLI sometimes prints an error and exits zero, which would let
          # this job go green having done nothing.
          if echo "$OUT" | grep -qiE 'error|forbidden|403|404|not created|authentication required'; then
            echo "::error::Kernel push failed — see above."
            exit 1
          fi
          echo "running: https://kaggle.com/code/${KAGGLE_USERNAME}/fashionsearch-gpu"

      - name: Wait for it to finish
        run: |
          set -e
          KERNEL="${KAGGLE_USERNAME}/fashionsearch-gpu"
          for i in $(seq 1 100); do        # 100 x 30s = 50 minutes
            sleep 30
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)
            echo "[$i] $STATUS"
            case "$STATUS" in
              *complete*|*COMPLETE*) echo "finished"; exit 0 ;;
              *error*|*ERROR*|*cancel*)
                echo "::error::Kaggle run failed. Log: https://kaggle.com/code/$KERNEL"
                exit 1 ;;
            esac
          done
          echo "::error::Timed out after 50 minutes."
          exit 1

      - name: Download what Kaggle produced
        run: |
          set -e
          mkdir -p /tmp/out
          kaggle kernels output "${KAGGLE_USERNAME}/fashionsearch-gpu" -p /tmp/out
          find /tmp/out -type f | head -30
          test -n "$(find /tmp/out -name 'manifest_*.json')" \
            || { echo "::error::no manifest in the kernel output"; exit 1; }

      - uses: databricks/setup-cli@main

      - name: Make sure the catalog and volumes exist
        # Workflow 2 also does this, but both workflows start on the same push
        # and run independently — nothing orders them. On a fresh workspace the
        # upload below would then fail because the volume does not exist yet.
        #
        # Setup is idempotent and takes about a minute, so running it here costs
        # little and removes the race entirely.
        run: |
          databricks bundle deploy -t dev
          databricks bundle run fashion_setup -t dev

      - name: Upload embeddings to the Unity Catalog volume
        run: |
          set -e
          CATALOG=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['catalog']['name'])")

          # The setup notebook creates this, but it is deployed code and could
          # be a version behind. Creating it here as well costs nothing and
          # means the upload cannot fail on a missing directory.
          pip install --quiet databricks-sdk
          python - <<PY
          from databricks.sdk import WorkspaceClient
          w = WorkspaceClient()
          try:
              w.volumes.create(catalog_name="${CATALOG}", schema_name="silver",
                               name="kaggle_inbox", volume_type="MANAGED")
              print("created ${CATALOG}.silver.kaggle_inbox")
          except Exception as exc:
              print(f"volume already present or not creatable here: {exc}")
          PY

          VOL="dbfs:/Volumes/${CATALOG}/silver/kaggle_inbox"
          for f in $(find /tmp/out -maxdepth 2 -name '*.parquet' -o -maxdepth 2 -name 'manifest_*.json'); do
            echo "uploading $(basename "$f")"
            databricks fs cp "$f" "${VOL}/$(basename "$f")" --overwrite
          done

          # The raw model files as well.
          #
          # This workspace cannot read model artifacts from a notebook — the
          # cluster's role is denied on that storage, the same denial that
          # blocked registration from inside Databricks. UC Volumes read fine,
          # so notebooks load the models from here instead.
          #
          # Unity Catalog is still the registry: versions, aliases, lineage and
          # the gate's record all live there. This is a readable copy, not a
          # second registry.
          for d in encoder_artifact detector_artifact; do
            SRC=$(find /tmp/out -type d -name "$d" | head -1)
            if [ -n "$SRC" ]; then
              echo "uploading $d/"
              databricks fs cp -r "$SRC" "${VOL}/${d}" --overwrite
            fi
          done

      - name: Register the models in Unity Catalog
        # From here, not from a Databricks notebook — see the header.
        #
        # Three registrations. The detector and encoder keep separate version
        # histories, which is what the gate and lineage need. The combined
        # search model pins one of each and is what the endpoint serves, so a
        # client sends a photo instead of orchestrating two calls and doing the
        # cropping itself.
        run: |
          set -e
          # transformers<5 to match the checkpoint's layer names — see
          # kaggle/run_on_kaggle.py build_encoder for why this matters.
          pip install --quiet mlflow torch torchvision 'transformers<5' timm pillow databricks-sdk

          ENC=$(find /tmp/out -type d -name encoder_artifact | head -1)
          DET=$(find /tmp/out -type d -name detector_artifact | head -1)
          MAN=$(find /tmp/out -name 'manifest_*.json' | head -1)
          test -n "$ENC" || { echo "::error::no encoder_artifact in the output"; exit 1; }
          test -n "$DET" || { echo "::error::no detector_artifact in the output"; exit 1; }

          eval $(python - <<'PY'
          import yaml
          r = yaml.safe_load(open("config.yaml"))["registry"]
          print(f"ENC_MODEL={r['encoder_model']}")
          print(f"DET_MODEL={r['detector_model']}")
          print(f"SEARCH_MODEL={r['search_model']}")
          PY
          )

          echo "--- encoder ---"
          python scripts/register_encoder.py \
            --artifact-dir "$ENC" --manifest "$MAN" --model-name "$ENC_MODEL"

          echo "--- detector ---"
          python scripts/register_detector.py \
            --artifact-dir "$DET" --manifest "$MAN" --model-name "$DET_MODEL"

          echo "--- combined search model ---"
          ENC_V=$(python -c "import json;print(json.load(open('registered.json'))['version'])")
          DET_V=$(python -c "import json;print(json.load(open('registered_detector.json'))['version'])")
          python scripts/register_search_model.py \
            --detector-dir "$DET" --encoder-dir "$ENC" --manifest "$MAN" \
            --model-name "$SEARCH_MODEL" \
            --detector-version "$DET_V" --encoder-version "$ENC_V"

  pipeline:
    name: Run the Databricks pipeline
    needs: gpu_run
    # always(): the pipeline runs whether the GPU job succeeded, failed or was
    # skipped. Skipped means "reuse existing embeddings", and failed still
    # leaves the previous run's embeddings in place — either way there is work
    # worth doing, and going dark on a Kaggle problem helps nobody.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Note what came before
        run: |
          echo "Kaggle job result: ${{ needs.gpu_run.result }}"
          if [ "${{ needs.gpu_run.result }}" != "success" ]; then
            echo "Running against whatever embeddings are already in the volume."
          fi

      - name: Deploy the latest code
        # Cheap, and guarantees the pipeline runs this commit rather than
        # whatever happened to be deployed last.
        run: databricks bundle deploy -t dev

      - name: Run the pipeline
        run: databricks bundle run fashion_pipeline -t dev

      - name: Where to look
        if: always()
        run: |
          echo "gold.retrieval_metrics — Recall@k, MRR, NDCG per slice."
          echo "Task 07_serving_check  — whether an endpoint was created."
          echo "Tasks 10 and 11        — real searches, and the dashboard."
