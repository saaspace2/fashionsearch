name: 1 · Kaggle GPU run

# Push the notebook, run it on a T4, collect the results, and hand them to
# Databricks. Everything from one `git push`.
#
# KAGGLE HOLDS NO CREDENTIALS. That is deliberate.
#
# Getting credentials onto Kaggle needs either a private Dataset — refused with
# 403 on accounts without phone verification — or Kaggle Secrets, which are
# stripped on every CLI push and would need re-ticking by hand each time. Both
# defeat the point of a pipeline.
#
# So Kaggle does pure GPU compute and writes to its kernel output. This workflow
# downloads that output, uploads the embeddings, and registers the encoder in
# Unity Catalog itself.
#
# Registering from here works for the same reason it would have worked from
# Kaggle: a GitHub runner is outside Databricks, so the upload uses the REST API
# with a token rather than a cluster's assumed IAM role — and it is that role
# which the workspace bucket policy explicitly denies.
#
# Secrets: KAGGLE_API_TOKEN  KAGGLE_USERNAME  DATABRICKS_HOST  DATABRICKS_TOKEN

on:
  push:
    branches: [main]
    paths:
      - 'kaggle/**'
      - 'src/**'
      - 'scripts/**'
      - 'config.yaml'
  workflow_dispatch:

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  gpu_run:
    name: Run on Kaggle, then hand results to Databricks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: "!contains(github.event.head_commit.message, '[skip kaggle]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade kaggle

      - name: Check Kaggle authentication
        run: |
          # Trim whitespace. A secret pasted with a trailing newline fails in a
          # way that is invisible in the log and works fine locally.
          TOKEN="$(echo -n "$KAGGLE_API_TOKEN" | tr -d '[:space:]')"
          echo "KAGGLE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          if [ -z "$TOKEN" ]; then
            echo "::error::KAGGLE_API_TOKEN is not set."
            echo "kaggle.com/settings/api -> Generate New Token"
            exit 1
          fi
          KAGGLE_API_TOKEN="$TOKEN" kaggle kernels list --mine --page-size 1
          echo "authenticated as ${KAGGLE_USERNAME}"

      - name: Build the notebook and push it — this also starts it
        run: |
          set -e
          mkdir -p /tmp/kernel
          python kaggle/build_notebook.py /tmp/kernel/fashionsearch-gpu.ipynb

          # No dataset_sources: the kernel needs no credentials.
          cat > /tmp/kernel/kernel-metadata.json <<JSON
          {
            "id": "${KAGGLE_USERNAME}/fashionsearch-gpu",
            "title": "FashionSearch GPU",
            "code_file": "fashionsearch-gpu.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": []
          }
          JSON

          OUT=$(kaggle kernels push -p /tmp/kernel --accelerator NvidiaTeslaT4 2>&1) || true
          echo "$OUT"
          # The CLI sometimes prints an error and exits zero, which would let
          # this job go green having done nothing.
          if echo "$OUT" | grep -qiE 'error|forbidden|403|404|not created|authentication required'; then
            echo "::error::Kernel push failed — see above."
            exit 1
          fi
          echo "running: https://kaggle.com/code/${KAGGLE_USERNAME}/fashionsearch-gpu"

      - name: Wait for it to finish
        run: |
          set -e
          KERNEL="${KAGGLE_USERNAME}/fashionsearch-gpu"
          for i in $(seq 1 100); do        # 100 x 30s = 50 minutes
            sleep 30
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)
            echo "[$i] $STATUS"
            case "$STATUS" in
              *complete*|*COMPLETE*) echo "finished"; exit 0 ;;
              *error*|*ERROR*|*cancel*)
                echo "::error::Kaggle run failed. Log: https://kaggle.com/code/$KERNEL"
                exit 1 ;;
            esac
          done
          echo "::error::Timed out after 50 minutes."
          exit 1

      - name: Download what Kaggle produced
        run: |
          set -e
          mkdir -p /tmp/out
          kaggle kernels output "${KAGGLE_USERNAME}/fashionsearch-gpu" -p /tmp/out
          find /tmp/out -type f | head -30
          test -n "$(find /tmp/out -name 'manifest_*.json')" \
            || { echo "::error::no manifest in the kernel output"; exit 1; }

      - uses: databricks/setup-cli@main

      - name: Make sure the catalog and volumes exist
        # Workflow 2 also does this, but both workflows start on the same push
        # and run independently — nothing orders them. On a fresh workspace the
        # upload below would then fail because the volume does not exist yet.
        #
        # Setup is idempotent and takes about a minute, so running it here costs
        # little and removes the race entirely.
        run: |
          databricks bundle deploy -t dev
          databricks bundle run fashion_setup -t dev

      - name: Upload embeddings to the Unity Catalog volume
        run: |
          set -e
          CATALOG=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['catalog']['name'])")
          VOL="dbfs:/Volumes/${CATALOG}/silver/kaggle_inbox"
          for f in $(find /tmp/out -maxdepth 2 -name '*.parquet' -o -maxdepth 2 -name 'manifest_*.json'); do
            echo "uploading $(basename "$f")"
            databricks fs cp "$f" "${VOL}/$(basename "$f")" --overwrite
          done

      - name: Register the encoder in Unity Catalog
        # From here, not from a Databricks notebook — see the header.
        run: |
          set -e
          pip install --quiet mlflow torch torchvision transformers pillow databricks-sdk
          ART=$(find /tmp/out -type d -name encoder_artifact | head -1)
          MAN=$(find /tmp/out -name 'manifest_*.json' | head -1)
          MODEL=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['registry']['encoder_model'])")
          python scripts/register_encoder.py \
            --artifact-dir "$ART" --manifest "$MAN" --model-name "$MODEL"

      - name: Run the Databricks pipeline
        # Already deployed above.
        run: databricks bundle run fashion_pipeline -t dev

      - name: Where to look
        if: always()
        run: |
          echo "gold.retrieval_metrics — Recall@k, MRR, NDCG per slice."
          echo "Task 07_serving_check  — whether an endpoint was created."
          echo "Tasks 10 and 11        — real searches, and the dashboard."
